[project]
name = "transcodarr"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django==6.1",
    "django-compressor>=4.6.0",
    "django-htmx>=1.23",
    "django-tasks-db>=0.12",
    "ffmpeg-python>=0.2.0",
    "gevent>=26.8.0",
    "tqdm>=4.70.0",
    "whitenoise>=6.9",
]

[dependency-groups]
dev = [
    "django-types>=0.24.0",
    "rich>=15.0.0",
    "ruff>=0.16.5",
]
