{% comment %}Sidebar link. Highlights itself when the current path matches.{% endcomment %}
<li>
  <a href="{{ url }}"
     class="flex items-center p-2 rounded-lg group
            {% if request.path == url %}bg-cyan-50 text-cyan-700 dark:bg-gray-700 dark:text-cyan-400
            {% else %}text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-700{% endif %}">
    <svg class="w-5 h-5 transition duration-75 {% if request.path == url %}text-cyan-600 dark:text-cyan-400{% else %}text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white{% endif %}"
         fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
      {% if icon == 'grid' %}<path stroke-linecap="round" stroke-linejoin="round" d="M4 5h6v6H4V5zm10 0h6v4h-6V5zM4 15h6v4H4v-4zm10-2h6v6h-6v-6z"/>
      {% elif icon == 'play' %}<path stroke-linecap="round" stroke-linejoin="round" d="M6 4l12 8-12 8V4z"/>
      {% elif icon == 'film' %}<path stroke-linecap="round" stroke-linejoin="round" d="M4 5h16v14H4V5zm0 4.5h16M4 14.5h16M8.5 5v14m7-14v14"/>
      {% elif icon == 'folder' %}<path stroke-linecap="round" stroke-linejoin="round" d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/>
      {% elif icon == 'flow' %}<path stroke-linecap="round" stroke-linejoin="round" d="M9 4h6v3H9V4zm0 13h6v3H9v-3zM3 10.5h5v3H3v-3zm13 0h5v3h-5v-3zM12 7v3m0 3.5V17M8 12h.5m7 0H15"/>
      {% elif icon == 'sliders' %}<path stroke-linecap="round" stroke-linejoin="round" d="M4 7h10M18 7h2M4 17h4M12 17h8M14 5v4M8 15v4"/>
      {% elif icon == 'cpu' %}<path stroke-linecap="round" stroke-linejoin="round" d="M8 8h8v8H8V8zM4 10h1m-1 4h1m14-4h1m-1 4h1M10 4v1m4-1v1m-4 14v1m4-1v1M6 6h12v12H6V6z"/>
      {% else %}<path stroke-linecap="round" stroke-linejoin="round" d="M12 8a4 4 0 100 8 4 4 0 000-8zM4 12h1m14 0h1M12 4v1m0 14v1"/>{% endif %}
    </svg>
    <span class="ms-3">{{ label }}</span>
    {% if count %}
      <span class="inline-flex items-center justify-center px-2 ms-auto text-xs font-medium rounded-full h-5 min-w-5 bg-cyan-100 text-cyan-800 dark:bg-cyan-900 dark:text-cyan-300">{{ count }}</span>
    {% endif %}
  </a>
</li>
