<header class="sticky top-0 z-20 border-b border-gray-200 bg-white">
  <div class="px-4 py-2.5 lg:px-6">
    <div class="flex items-center justify-between">
      
      <!-- Left side: Mobile menu button & Search -->
      <div class="flex items-center justify-start gap-3">
        <button id="sidebar-toggle" type="button" class="inline-flex items-center rounded-lg p-2 text-sm text-gray-500 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 lg:hidden">
          <span class="sr-only">Toggle sidebar</span>
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>

        <form action="#" method="GET" class="hidden sm:block">
          <label for="topbar-search" class="sr-only">Search</label>
          <div class="relative w-64 lg:w-96">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
              <svg class="h-5 w-5 text-gray-500" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
              </svg>
            </div>
            <input type="text" name="q" id="topbar-search" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2 pl-10 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500" placeholder="Search...">
          </div>
        </form>
      </div>

      <!-- Right side: Actions & User Dropdown -->
      <div class="flex items-center gap-3">
        <!-- Notifications Button -->
        <button type="button" class="rounded-lg p-2 text-gray-500 hover:bg-gray-100 hover:text-gray-900 focus:ring-2 focus:ring-gray-300">
          <span class="sr-only">View notifications</span>
          <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z"/>
          </svg>
        </button>

        <!-- Profile Menu Dropdown -->
        <div class="relative">
          <button type="button" class="flex rounded-full bg-gray-800 text-sm focus:ring-4 focus:ring-gray-300" id="user-menu-button" aria-expanded="false" data-dropdown-toggle="user-dropdown">
            <span class="sr-only">Open user menu</span>
            <div class="flex h-8 w-8 items-center justify-center rounded-full bg-blue-600 text-sm font-semibold text-white">
              {% if user.is_authenticated %}{{ user.username|slice:":1"|upper }}{% else %}G{% endif %}
            </div>
          </button>

          <!-- Flowbite Dropdown menu -->
          <div class="z-50 my-4 hidden list-none divide-y divide-gray-100 rounded-lg bg-white text-base shadow" id="user-dropdown">
            <div class="px-4 py-3">
              {% if user.is_authenticated %}
                <span class="block text-sm text-gray-900">{{ user.get_full_name|default:user.username }}</span>
                <span class="block truncate text-sm text-gray-500">{{ user.email }}</span>
              {% else %}
                <span class="block text-sm text-gray-900">Guest User</span>
              {% endif %}
            </div>
            <ul class="py-2" aria-labelledby="user-menu-button">
              <li>
                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Settings</a>
              </li>
              {% if user.is_authenticated %}
                <li>
                  <a href="{% url 'admin:logout' %}" class="block px-4 py-2 text-sm text-red-600 hover:bg-gray-100">Sign out</a>
                </li>
              {% else %}
                <li>
                  <a href="{% url 'admin:login' %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Sign in</a>
                </li>
              {% endif %}
            </ul>
          </div>
        </div>

      </div>

    </div>
  </div>
</header>
